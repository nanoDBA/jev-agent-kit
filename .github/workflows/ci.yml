name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package (editable) and development tools
        run: python -m pip install -e . pytest ruff mypy
      - name: pytest
        run: python -m pytest -q
      - name: ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m ruff check src tests scripts tools examples
      - name: mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m mypy

  package:
    name: packaging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel
        run: python -m pip wheel . -w dist --no-deps
      - name: Install into a fresh venv and smoke test outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/jev-kit" --help
          "$RUNNER_TEMP/venv/bin/python" -c "import jev_kit; print(jev_kit.__file__)"
